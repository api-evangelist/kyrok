aid: kyrok
name: Kyrok
description: 'Kyrok GmbH is a Berlin-based software company building an AI operating
  system for mid-sized pharmaceutical and chemical manufacturers in Europe. The platform
  layers over a company''s existing ERP (SAP S/4HANA, SAP R/3, Microsoft Dynamics 365,
  Infor, Applus) and connects the systems supply chain teams currently hold together
  by hand into intelligent operations across customer service, production planning,
  material planning and procurement. Kyrok positions itself on an "AI assists, people
  decide" model, running on European infrastructure in Frankfurt am Main, GDPR-compliant,
  with ISO 27001 and ISO 42001 certifications in progress. The company announced a
  EUR 3.1M round in June 2026 and names AnalytiChem and Konapharma as customers. Kyrok
  connects to ERP systems via API but publishes no public developer API, API reference,
  or SDKs as of this enrichment pass.'
